name: Feature Request
about: Suggest new functionality or improvements
labels:
  - enhancement
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: Why is this useful? What problem does it solve?
    validations:
      required: true
  - type: input
    id: upstream
    attributes:
      label: Upstream issue/PR
      description: Link to any related upstream forgejo-cli issues or PRs, if applicable
    validations:
      required: false
