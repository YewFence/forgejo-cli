[package]
name = "forgejo-cli-plus"
version = "1.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
repository = "https://codeberg.org/stalecontext/forgejo-cli-plus"
description = "CLI tool for Forgejo"
keywords = ["cli", "forgejo"]
categories = ["command-line-utilities", "development-tools"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[package.metadata.binstall]
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/forgejo-cli-plus-linux-x86_64.tar.gz"

[package.metadata.binstall.overrides.x86_64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/v{ version }/forgejo-cli-plus-linux-x86_64.tar.gz"

[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/forgejo-cli-plus-macos-x86_64.tar.gz"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/forgejo-cli-plus-macos-aarch64.tar.gz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/forgejo-cli-plus-windows-x86_64.zip"
pkg-fmt = "zip"

[package.metadata.binstall.overrides.x86_64-pc-windows-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/forgejo-cli-plus-windows-x86_64.zip"
pkg-fmt = "zip"

[[bin]]
name = "fj"
path = "src/main.rs"

[features]
update-check = ["dep:semver"]

[dependencies]
auth-git2 = "0.6.0"
base64ct = { version = "1.7.3", features = ["std"] }
cfg-if = "1.0.0"
clap = { version = "4.5.34", features = ["derive"] }
clap_complete = "4.5.47"
comfy-table = "7"
comrak = { version = "0.52.0", default-features = false }
directories = "6.0.0"
eyre = "0.6.12"
forgejo-api = { version = "0.11.0", default-features = false, features = ["rustls-tls"] }
futures = "0.3.31"
git2 = { version = "0.21.0", features = ["vendored-libgit2", "https", "ssh"] }
hyper = "1.6.0"
hyper-util = { version = "0.1.11", features = ["tokio", "server", "http1", "http2"] }
open = "5.3.2"
rand = "0.10.1"
regex = "1.12.2"
semver = { version = "1.0.26", optional = true }
serde = { version = "1.0.219", features = ["derive"] }
serde-saphyr = "0.0.28"
serde_json = "1.0.140"
sha2 = "0.11.0"
shlex = "1.3.0"
soft_assert = "0.1.1"
ssh2-config = "0.7.0"
terminal_size = "0.4.4"
time = { version = "0.3.41", features = ["formatting", "local-offset", "macros"] }
tokio = { version = "1.44.1", features = ["full"] }
url = "2.5.4"
uuid = { version = "1.16.0", features = ["v4"] }

# forgejo-api 0.11.0 rejects responses from Forgejo servers older than v16
# because some Option fields require key presence; the vendored copy adds
# serde(default) to those fields. See vendor/forgejo-api/PATCHES.md.
[patch.crates-io]
forgejo-api = { path = "vendor/forgejo-api" }

[dev-dependencies]
assert_cmd = "2"
insta = "1"
predicates = "3"
rstest = "0.25"
tempfile = "3"
wiremock = "0.6"

# Optimize serde and forgejo-api in dev/test builds to prevent
# stack overflow when deserializing deeply nested types (e.g.
# PullRequest with Repository objects in head/base).
[profile.dev.package.serde]
opt-level = 2
[profile.dev.package.serde_json]
opt-level = 2
[profile.dev.package.forgejo-api]
opt-level = 2

[profile.release]
lto = true
codegen-units = 1
