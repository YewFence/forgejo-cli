[package]
name = "forgejo-cli"
version = "2.2.0"
description = "Command-line interface for Forgejo"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/YewFence/forgejo-cli"
keywords = ["cli", "forgejo"]
categories = ["command-line-utilities", "development-tools"]
publish = false

[[bin]]
name = "fj"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[features]
update-check = ["dep:semver"]

[dependencies]
auth-git2 = "0.6.0"
base64ct = { version = "1.8.3", features = ["std"] }
cfg-if = "1.0.5"
clap = { version = "4.6.7", features = ["derive", "env"] }
clap_complete = "4.6.11"
comfy-table = "7.2.2"
comrak = { version = "0.59.0", default-features = false }
directories = "6.0.0"
eyre = "0.6.14"
forgejo-api = { version = "0.12.0", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots"] }
futures = "0.3.34"
git2 = { version = "0.21.0", features = ["vendored-libgit2", "https", "ssh"] }
hyper = "1.12.0"
hyper-util = { version = "0.1.21", features = ["tokio", "server", "http1", "http2"] }
open = "5.4.5"
rand = "0.10.3"
regex = "1.13.1"
semver = { version = "1.0.28", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "0.0.29"
serde_json = "1.0.154"
sha2 = "0.11.1"
shlex = "1.3.0"
soft_assert = "0.1.1"
ssh2-config = "0.9.0"
terminal_size = "0.4.4"
time = { version = "0.3.55", features = ["formatting", "local-offset", "macros"] }
tokio = { version = "1.54.1", features = ["full"] }
url = "2.5.8"
uuid = { version = "1.29.0", features = ["v4"] }

# forgejo-api 0.11.0 rejects responses from Forgejo servers older than v16
# because some Option fields require key presence; the vendored copy adds
# serde(default) to those fields. See vendor/forgejo-api/PATCHES.md.
[patch.crates-io]
forgejo-api = { path = "vendor/forgejo-api" }

[dev-dependencies]
assert_cmd = "2.2.2"
clap-markdown = "0.1.5"
predicates = "3.1.4"
rstest = "0.28.0"
tempfile = "3.27.0"
wiremock = "0.6.5"

# Optimize serde and forgejo-api in dev/test builds to prevent
# stack overflow when deserializing deeply nested types (e.g.
# PullRequest with Repository objects in head/base).
[profile.dev.package.serde]
opt-level = 2

[profile.dev.package.serde_json]
opt-level = 2

[profile.dev.package.forgejo-api]
opt-level = 2

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
